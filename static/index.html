<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn Prediction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 10px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { color: #333; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        button { width: 100%; padding: 15px; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #5568d3; }
        .result { margin-top: 20px; padding: 20px; border-radius: 5px; display: none; }
        .result.churn { background: #fee; border: 2px solid #f88; }
        .result.no-churn { background: #efe; border: 2px solid #8f8; }
        .result h2 { margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 Customer Churn Prediction</h1>
        <form id="predictionForm">
            <div class="grid">
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="0">Female</option>
                        <option value="1">Male</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Senior Citizen</label>
                    <select name="senior" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Partner</label>
                    <select name="partner" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Dependents</label>
                    <select name="dependents" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tenure (months)</label>
                    <input type="number" name="tenure" min="0" max="100" value="12" required>
                </div>
                <div class="form-group">
                    <label>Phone Service</label>
                    <select name="phone" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Multiple Lines</label>
                    <select name="lines" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                        <option value="2">No phone service</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Internet Service</label>
                    <select name="internet" required>
                        <option value="0">DSL</option>
                        <option value="1">Fiber optic</option>
                        <option value="2">No</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Online Security</label>
                    <select name="security" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                        <option value="2">No internet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Online Backup</label>
                    <select name="backup" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                        <option value="2">No internet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Device Protection</label>
                    <select name="protection" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                        <option value="2">No internet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tech Support</label>
                    <select name="support" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                        <option value="2">No internet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Streaming TV</label>
                    <select name="tv" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                        <option value="2">No internet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Streaming Movies</label>
                    <select name="movies" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                        <option value="2">No internet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Contract</label>
                    <select name="contract" required>
                        <option value="0">Month-to-month</option>
                        <option value="1">One year</option>
                        <option value="2">Two year</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Paperless Billing</label>
                    <select name="billing" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select name="payment" required>
                        <option value="0">Bank transfer</option>
                        <option value="1">Credit card</option>
                        <option value="2">Electronic check</option>
                        <option value="3">Mailed check</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Monthly Charges ($)</label>
                    <input type="number" name="monthly" step="0.01" min="0" value="70.00" required>
                </div>
                <div class="form-group">
                    <label>Total Charges ($)</label>
                    <input type="number" name="total" step="0.01" min="0" value="840.00" required>
                </div>
            </div>
            <button type="submit">Predict Churn</button>
        </form>
        <div id="result" class="result"></div>
    </div>

    <script>
        const API_URL = 'https://mlops-churn-prediction-4qvb.onrender.com';
        
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const features = [
                parseFloat(form.gender.value),
                parseFloat(form.senior.value),
                parseFloat(form.partner.value),
                parseFloat(form.dependents.value),
                parseFloat(form.tenure.value),
                parseFloat(form.phone.value),
                parseFloat(form.lines.value),
                parseFloat(form.internet.value),
                parseFloat(form.security.value),
                parseFloat(form.backup.value),
                parseFloat(form.protection.value),
                parseFloat(form.support.value),
                parseFloat(form.tv.value),
                parseFloat(form.movies.value),
                parseFloat(form.contract.value),
                parseFloat(form.billing.value),
                parseFloat(form.payment.value),
                parseFloat(form.monthly.value),
                parseFloat(form.total.value)
            ];

            try {
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ features })
                });
                
                const data = await response.json();
                const resultDiv = document.getElementById('result');
                
                if (data.prediction === 1) {
                    resultDiv.className = 'result churn';
                    resultDiv.innerHTML = `
                        <h2>⚠️ High Churn Risk</h2>
                        <p><strong>Probability:</strong> ${(data.probability * 100).toFixed(1)}%</p>
                        <p>This customer is likely to churn. Consider retention strategies.</p>
                    `;
                } else {
                    resultDiv.className = 'result no-churn';
                    resultDiv.innerHTML = `
                        <h2>✅ Low Churn Risk</h2>
                        <p><strong>Probability:</strong> ${(data.probability * 100).toFixed(1)}%</p>
                        <p>This customer is likely to stay.</p>
                    `;
                }
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
